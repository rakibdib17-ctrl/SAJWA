name: Build SAJWA Android APK

on:
  push:
    branches: [main, dev/build198-ui-notification-widget, redesign/clean-architecture-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch selected Adhan audio
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --retry-all-errors 'https://download.tvquran.com/download/TvQuran.com__Athan/TvQuran.com__08.athan.mp3' -o app/src/main/res/raw/adhan.mp3
          test -s app/src/main/res/raw/adhan.mp3
          file app/src/main/res/raw/adhan.mp3
      - name: Trim final 9.5 seconds from Adhan audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          input="app/src/main/res/raw/adhan.mp3"
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input")
          trim_duration=$(awk -v d="$duration" 'BEGIN { t=d-9.5; if (t <= 0) exit 1; printf "%.3f", t }')
          ffmpeg -y -i "$input" -t "$trim_duration" -vn -codec:a libmp3lame -q:a 2 app/src/main/res/raw/adhan-trimmed.mp3
          mv app/src/main/res/raw/adhan-trimmed.mp3 "$input"
          echo "Original duration: $duration seconds"
          echo "New duration: $(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input") seconds"
          test -s "$input"
      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          import re
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", source, flags=re.I)
          if not scripts:
              raise SystemExit("No inline script blocks found")
          for index, script in enumerate(scripts):
              path = Path(f"/tmp/sajwa-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {index + 1}/{len(scripts)}")
          PY
          for script in /tmp/sajwa-inline-*.js; do node --check "$script"; done
      - name: Set up Node.js for WebView smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run SAJWA browser smoke tests
        run: |
          python3 -m http.server 4173 --directory app/src/main/assets >/tmp/sajwa-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          node tools/sajwa-smoke-test.cjs
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sajwa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build SAJWA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch selected Adhan audio
        run: |
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --retry-all-errors 'https://download.tvquran.com/download/TvQuran.com__Athan/TvQuran.com__08.athan.mp3' -o app/src/main/res/raw/adhan.mp3
          test -s app/src/main/res/raw/adhan.mp3
          file app/src/main/res/raw/adhan.mp3
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sajwa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
